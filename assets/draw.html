<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Drawing - Grapho</title>
  <meta name="theme-color" content="#232126">
  <link rel="icon" type="image/x-icon" href="/assets/favicon.ico">
  <script src="/assets/theme.js"></script>
  <link rel="stylesheet" href="/assets/app.css">
  <script src="/assets/quick-open.js" defer></script>
  <script src="/assets/draw.js" type="module"></script>
</head>
<body class="drawing-page">
  <header class="editor-header drawing-header">
    <div class="editor-header-start">
      <a class="back-link" href="/" id="drawingLibraryLink" aria-label="Back to library">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="m14.5 5-7 7 7 7" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span>Library</span>
      </a>
    </div>
    <div class="drawing-toolbar" id="drawingToolbar" role="toolbar" aria-label="Drawing tools">
      <button class="drawing-tool" type="button" data-draw-tool="select" aria-pressed="true" aria-label="Select" aria-keyshortcuts="V" title="Select (V)">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 3 14 9-7 1.1-3.2 6.5z" fill="currentColor"/><path d="m12 13 4 7"/></svg>
        <kbd aria-hidden="true">V</kbd>
      </button>
      <button class="drawing-tool" type="button" data-draw-tool="rectangle" aria-pressed="false" aria-label="Rectangle" aria-keyshortcuts="R" title="Rectangle (R)">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="1.5"/></svg>
        <kbd aria-hidden="true">R</kbd>
      </button>
      <button class="drawing-tool" type="button" data-draw-tool="diamond" aria-pressed="false" aria-label="Diamond" aria-keyshortcuts="D" title="Diamond (D)">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 2.5 9.5 9.5-9.5 9.5L2.5 12z"/></svg>
        <kbd aria-hidden="true">D</kbd>
      </button>
      <button class="drawing-tool" type="button" data-draw-tool="ellipse" aria-pressed="false" aria-label="Ellipse" aria-keyshortcuts="O" title="Ellipse (O)">
        <svg viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="12" cy="12" rx="9" ry="8.5"/></svg>
        <kbd aria-hidden="true">O</kbd>
      </button>
      <button class="drawing-tool" type="button" data-draw-tool="arrow" aria-pressed="false" aria-label="Arrow" aria-keyshortcuts="A" title="Arrow (A)">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12h17m-6-6 6 6-6 6"/></svg>
        <kbd aria-hidden="true">A</kbd>
      </button>
      <button class="drawing-tool" type="button" data-draw-tool="line" aria-pressed="false" aria-label="Line" aria-keyshortcuts="L" title="Line (L)">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12h18"/></svg>
        <kbd aria-hidden="true">L</kbd>
      </button>
      <button class="drawing-tool" type="button" data-draw-tool="pencil" aria-pressed="false" aria-label="Pencil" aria-keyshortcuts="P" title="Pencil (P)">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m4 15.9 12-12a2.1 2.1 0 0 1 3 0l1.1 1.1a2.1 2.1 0 0 1 0 3l-12 12-5 1zM14.8 5.1l4.1 4.1"/></svg>
        <kbd aria-hidden="true">P</kbd>
      </button>
      <button class="drawing-tool" type="button" data-draw-tool="text" aria-pressed="false" aria-label="Text" aria-keyshortcuts="T" title="Text (T)">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7V4h16v3m-8-3v16m-4 0h8"/></svg>
        <kbd aria-hidden="true">T</kbd>
      </button>
      <button class="drawing-tool" type="button" id="drawingAddImage" aria-label="Add image" aria-keyshortcuts="I" title="Add image (I)" disabled>
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="4.5" width="17" height="15" rx="2"/><circle cx="9" cy="9.5" r="1.4"/><path d="m3.5 16 4.5-4 4 3.5 3.5-4 5 4.5"/></svg>
        <kbd aria-hidden="true">I</kbd>
      </button>
      <button class="drawing-tool" type="button" data-draw-tool="eraser" aria-pressed="false" aria-label="Eraser" aria-keyshortcuts="E" title="Eraser (E)">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3.8 13.4 9.8-9.8a2 2 0 0 1 2.8 0l4 4a2 2 0 0 1 0 2.8L10.8 20H8.4l-4.6-4.6a1.4 1.4 0 0 1 0-2zM8 9.3l6.7 6.7M10 20h11"/></svg>
        <kbd aria-hidden="true">E</kbd>
      </button>
      <div class="drawing-more-wrap">
        <button class="drawing-tool" id="drawingMore" type="button" title="More actions" aria-label="More actions" aria-haspopup="menu" aria-controls="drawingMoreMenu" aria-expanded="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><g fill="currentColor" stroke="none"><circle cx="12" cy="5" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="12" cy="19" r="1.6"/></g></svg>
        </button>
        <div class="popover-menu drawing-more-menu" id="drawingMoreMenu" role="menu" aria-label="More drawing actions" hidden>
          <button class="menu-item" type="button" role="menuitem" data-draw-action="select-all" disabled>Select all</button>
          <button class="menu-item" type="button" role="menuitem" data-draw-action="duplicate" disabled>Duplicate selection</button>
          <button class="menu-item" type="button" role="menuitem" data-draw-action="background" aria-haspopup="dialog" aria-controls="drawingBackgroundDialog" disabled>Background</button>
          <button class="menu-item menu-item-danger" type="button" role="menuitem" data-draw-action="delete" disabled>Delete selection</button>
        </div>
      </div>
    </div>
    <div class="editor-header-end">
      <span class="drawing-status" id="drawingStatus" role="status"></span>
      <button class="icon-button" id="drawingUndo" type="button" title="Undo (Ctrl+Z)" aria-label="Undo" disabled>
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M9 6.8 4.4 11.4 9 16" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><path d="M4.8 11.4h9.1a4.7 4.7 0 0 1 0 9.4h-2.2" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
      </button>
      <button class="icon-button" id="drawingRedo" type="button" title="Redo (Ctrl+Shift+Z)" aria-label="Redo" disabled>
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M15 6.8 19.6 11.4 15 16" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><path d="M19.2 11.4H10.1a4.7 4.7 0 0 0 0 9.4h2.2" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
      </button>
    </div>
  </header>

  <main class="drawing-main" id="drawingMain" aria-busy="true">
    <input type="file" id="drawingImageInput" accept="image/png,image/jpeg,image/webp,image/gif,image/avif" hidden>
    <p class="drawing-error" id="drawingImageError" role="alert" hidden></p>
    <div class="drawing-error" id="drawingError" hidden>
      <p id="drawingErrorMessage" role="alert"></p>
      <button class="button button-quiet" id="drawingRetry" type="button">Try again</button>
    </div>
    <div class="drawing-title-row">
      <button class="button button-quiet drawing-style-toggle" id="drawingStyleToggle" type="button" aria-label="Shape style" title="Shape style" aria-controls="drawingStylePanel" aria-expanded="false" hidden>
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16M9 4v4m6 2v4m-5 2v4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
        <span>Shape style</span>
      </button>
      <h1 class="drawing-title">
        <input id="drawingTitle" type="text" aria-label="Drawing title" placeholder="Untitled drawing" maxlength="200" disabled>
      </h1>
    </div>
    <div class="drawing-surface">
      <svg class="drawing-canvas" id="drawingCanvas" viewBox="0 0 1000 1000" role="group" aria-label="Drawing canvas">
        <g class="drawing-ink" id="drawingInk"></g>
        <g id="drawingSelection" aria-hidden="true"></g>
      </svg>
      <textarea class="drawing-text-editor" id="drawingTextEditor" aria-label="Drawing text" wrap="off" spellcheck="false" hidden></textarea>
      <aside class="drawing-style-panel" id="drawingStylePanel" aria-label="Shape style" hidden>
        <fieldset>
          <legend>Stroke</legend>
          <div class="drawing-style-options" data-shape-style="stroke"></div>
        </fieldset>
        <fieldset id="drawingStyleBackground">
          <legend>Background</legend>
          <div class="drawing-style-options" data-shape-style="fill"></div>
        </fieldset>
        <fieldset id="drawingStyleWidth">
          <legend>Stroke width</legend>
          <div class="drawing-style-options" data-shape-style="width"></div>
        </fieldset>
        <fieldset id="drawingStylePattern">
          <legend>Stroke style</legend>
          <div class="drawing-style-options" data-shape-style="pattern"></div>
        </fieldset>
        <fieldset id="drawingStyleRoughness">
          <legend>Sloppiness</legend>
          <div class="drawing-style-options" data-shape-style="roughness"></div>
        </fieldset>
        <fieldset id="drawingStylePressure" hidden>
          <legend>Pressure</legend>
          <div class="drawing-style-options" data-shape-style="pressure"></div>
        </fieldset>
        <fieldset id="drawingStyleEdges">
          <legend>Edges</legend>
          <div class="drawing-style-options" data-shape-style="edges"></div>
        </fieldset>
        <fieldset id="drawingArrowType" hidden>
          <legend>Arrow type</legend>
          <div class="drawing-style-options" data-shape-style="route"></div>
        </fieldset>
        <fieldset id="drawingArrowheads" hidden>
          <legend>Arrowheads</legend>
          <div class="drawing-arrowheads">
            <label>Start <select data-arrowhead="start_head"></select></label>
            <label>End <select data-arrowhead="end_head"></select></label>
          </div>
        </fieldset>
        <fieldset id="drawingTextFamily" hidden>
          <legend>Font family</legend>
          <div class="drawing-style-options" data-shape-style="font_family"></div>
        </fieldset>
        <fieldset id="drawingTextSize" hidden>
          <legend>Font size</legend>
          <div class="drawing-style-options" data-shape-style="font_size"></div>
        </fieldset>
        <fieldset id="drawingTextAlignment" hidden>
          <legend>Text align</legend>
          <div class="drawing-style-options" data-shape-style="text_align"></div>
        </fieldset>
        <div class="drawing-style-opacity">
          <label for="drawingStyleOpacity">Opacity</label>
          <output for="drawingStyleOpacity" id="drawingStyleOpacityValue">100%</output>
          <input type="range" id="drawingStyleOpacity" min="0" max="100" step="1" value="100">
        </div>
        <fieldset id="drawingStyleLayers">
          <legend>Layers</legend>
          <div class="drawing-style-options" data-shape-style="layers"></div>
        </fieldset>
      </aside>
    </div>
  </main>
  <dialog class="modal modal-small" id="drawingBackgroundDialog" aria-labelledby="drawingBackgroundTitle">
    <form class="modal-panel" method="dialog">
      <h2 id="drawingBackgroundTitle">Drawing background</h2>
      <fieldset class="drawing-background-options">
        <legend class="sr-only">Background pattern</legend>
        <label>
          <span class="drawing-background-preview" aria-hidden="true"></span>
          <input type="radio" name="background" value="dots" checked> Dots
        </label>
        <label>
          <span class="drawing-background-preview" data-background="grid" aria-hidden="true"></span>
          <input type="radio" name="background" value="grid"> Grid
        </label>
        <label>
          <span class="drawing-background-preview" data-background="ruled" aria-hidden="true"></span>
          <input type="radio" name="background" value="ruled"> Ruled
        </label>
        <label>
          <span class="drawing-background-preview" data-background="plain" aria-hidden="true"></span>
          <input type="radio" name="background" value="plain"> Plain
        </label>
      </fieldset>
      <div class="drawing-background-colors">
        <label>Background color <input type="color" name="color"></label>
        <label>Pattern color <input type="color" name="patternColor"></label>
      </div>
      <div class="modal-actions">
        <button class="button button-quiet" id="drawingBackgroundResetColors" type="button">Reset colors</button>
        <span class="modal-actions-spacer"></span>
        <button class="button button-quiet" id="drawingBackgroundCancel" type="button">Cancel</button>
        <button class="button button-primary" type="submit">Apply</button>
      </div>
    </form>
  </dialog>
</body>
</html>
