<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Drawing - Grapho</title>
  <meta name="theme-color" content="#232126">
  <link rel="icon" type="image/x-icon" href="/assets/favicon.ico">
  <script src="/assets/theme.js"></script>
  <link rel="stylesheet" href="/assets/app.css">
  <script src="/assets/quick-open.js" defer></script>
  <script src="/assets/draw.js" type="module"></script>
</head>
<body>
  <header class="editor-header version-header">
    <div class="editor-header-start">
      <a class="back-link" href="/" id="drawingLibraryLink" aria-label="Back to library">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="m14.5 5-7 7 7 7" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span>Library</span>
      </a>
    </div>
    <div class="editor-header-end">
      <span class="drawing-status" id="drawingStatus" role="status"></span>
      <button class="icon-button" id="drawingUndo" type="button" title="Undo stroke (Ctrl+Z)" aria-label="Undo stroke" disabled>
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M9 6.8 4.4 11.4 9 16" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><path d="M4.8 11.4h9.1a4.7 4.7 0 0 1 0 9.4h-2.2" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
      </button>
      <button class="icon-button" id="drawingRedo" type="button" title="Redo stroke (Ctrl+Shift+Z)" aria-label="Redo stroke" disabled>
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M15 6.8 19.6 11.4 15 16" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><path d="M19.2 11.4H10.1a4.7 4.7 0 0 0 0 9.4h2.2" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
      </button>
    </div>
  </header>

  <main class="drawing-main" id="drawingMain" aria-busy="true">
    <div class="drawing-error" id="drawingError" hidden>
      <p id="drawingErrorMessage" role="alert"></p>
      <button class="button button-quiet" id="drawingRetry" type="button">Try again</button>
    </div>
    <h1 class="drawing-title">
      <input id="drawingTitle" type="text" aria-label="Drawing title" placeholder="Untitled drawing" maxlength="200" disabled>
    </h1>
    <svg class="drawing-canvas" id="drawingCanvas" viewBox="0 0 1000 1000" role="img" aria-label="Pencil drawing canvas">
      <g class="drawing-ink" id="drawingInk"></g>
    </svg>
  </main>
</body>
</html>
