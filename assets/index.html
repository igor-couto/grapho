<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Grapho</title>
  <meta name="description" content="A calm, local-first document editor. No accounts, no clutter. Just a page when you need one.">
  <meta name="theme-color" content="#f3efe6">
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
  <link rel="preload" href="/assets/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/assets/fonts/literata-latin.woff2" as="font" type="font/woff2" crossorigin>
  <script src="/assets/theme.js"></script>
  <link rel="stylesheet" href="/assets/app.css">
  <script src="/assets/home.js" defer></script>
</head>
<body class="home-page">
  <a class="skip-link" href="#library">Skip to your library</a>

  <div class="ambient-layer" aria-hidden="true">
    <div class="ambient ambient-top"></div>
    <div class="ambient ambient-bottom"></div>
  </div>

  <header class="site-header">
    <div class="shell site-header-inner home-header-row">
      <span class="home-header-spacer" aria-hidden="true"></span>

      <label class="search-box">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <circle cx="10.8" cy="10.8" r="6.3" stroke="currentColor" stroke-width="1.7"/>
          <path d="m15.5 15.5 4 4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
        </svg>
        <input id="searchDocuments" type="search" placeholder="Search documents" autocomplete="off" spellcheck="false" aria-label="Search documents">
        <kbd aria-hidden="true">/</kbd>
      </label>

      <button class="icon-button theme-toggle" type="button" data-theme-toggle aria-label="Switch to dark theme">
        <svg class="icon icon-sun" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <circle cx="12" cy="12" r="3.5" stroke="currentColor" stroke-width="1.7"/>
          <path d="M12 2.8v2M12 19.2v2M21.2 12h-2M4.8 12h-2M18.5 5.5l-1.4 1.4M6.9 17.1l-1.4 1.4M18.5 18.5l-1.4-1.4M6.9 6.9 5.5 5.5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
        </svg>
        <svg class="icon icon-moon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M20 14.4A8.2 8.2 0 0 1 9.6 4a8.2 8.2 0 1 0 10.4 10.4Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>
  </header>

  <main class="home-main">
    <div class="new-document-wrap shell">
      <button class="new-document-button" type="button" id="newDocument">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
        <span>New Document</span>
      </button>
    </div>

    <section class="library shell" id="library" aria-label="Documents">

      <div class="library-message" id="libraryMessage" role="status" aria-live="polite" hidden>
        <span id="libraryMessageText"></span>
        <button class="text-button" type="button" id="retryLoad" hidden>Try again</button>
      </div>

      <div class="document-grid" id="documentsGrid" aria-busy="true">
        <div class="document-card document-card-skeleton" aria-hidden="true">
          <span class="skeleton skeleton-icon"></span>
          <span class="skeleton skeleton-title"></span>
          <span class="skeleton skeleton-line"></span>
          <span class="skeleton skeleton-line skeleton-line-short"></span>
          <span class="skeleton skeleton-meta"></span>
        </div>
        <div class="document-card document-card-skeleton" aria-hidden="true">
          <span class="skeleton skeleton-icon"></span>
          <span class="skeleton skeleton-title"></span>
          <span class="skeleton skeleton-line"></span>
          <span class="skeleton skeleton-line skeleton-line-short"></span>
          <span class="skeleton skeleton-meta"></span>
        </div>
        <div class="document-card document-card-skeleton" aria-hidden="true">
          <span class="skeleton skeleton-icon"></span>
          <span class="skeleton skeleton-title"></span>
          <span class="skeleton skeleton-line"></span>
          <span class="skeleton skeleton-line skeleton-line-short"></span>
          <span class="skeleton skeleton-meta"></span>
        </div>
      </div>

      <div class="empty-state" id="emptyState" hidden>
        <div class="empty-illustration" aria-hidden="true">
          <svg viewBox="0 0 84 96" fill="none">
            <rect x="8" y="6" width="64" height="82" rx="5" fill="var(--surface)" stroke="var(--line-strong)"/>
            <path d="M23 28h34M23 39h34M23 50h24" stroke="var(--line-strong)" stroke-width="2.5" stroke-linecap="round"/>
            <path d="M23 65c7-5 12-5 19 0s12 5 19 0" stroke="var(--accent)" stroke-width="2.5" stroke-linecap="round"/>
            <circle cx="68" cy="77" r="10" fill="var(--accent)" stroke="var(--bg)" stroke-width="4"/>
            <path d="M68 72v10M63 77h10" stroke="var(--paper)" stroke-width="1.8" stroke-linecap="round"/>
          </svg>
        </div>
        <h3 id="emptyTitle">No documents yet</h3>
        <p id="emptyText" hidden></p>
        <div class="empty-actions" id="emptyActions" hidden>
          <button class="button button-quiet" type="button" id="emptyClearSearch">Clear search</button>
        </div>
      </div>
    </section>
  </main>

  <template id="documentCardTemplate">
    <article class="document-card">
      <a class="document-card-link">
        <span class="document-glyph" aria-hidden="true">
          <svg viewBox="0 0 32 32" fill="none">
            <path d="M8 4.5h11.2L25 10.3v17.2H8V4.5Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
            <path d="M19 4.5v6h6" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
            <path d="M12.2 16h8.6M12.2 20h6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
        </span>
        <span class="document-copy">
          <span class="document-card-title"></span>
          <span class="document-excerpt"></span>
          <span class="document-meta">
            <span class="document-edited"></span>
            <span class="document-meta-dot" aria-hidden="true">·</span>
            <span class="document-words"></span>
          </span>
        </span>
      </a>
      <div class="card-menu-wrap">
        <button class="card-menu-button" type="button" aria-label="Document actions" aria-haspopup="menu" aria-expanded="false">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <circle cx="5" cy="12" r="1.5" fill="currentColor"/>
            <circle cx="12" cy="12" r="1.5" fill="currentColor"/>
            <circle cx="19" cy="12" r="1.5" fill="currentColor"/>
          </svg>
        </button>
        <div class="card-menu" role="menu" hidden>
          <a class="menu-item card-open" role="menuitem">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M5 19 19 5M9 5h10v10" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
            Open
          </a>
          <button class="menu-item card-rename" type="button" role="menuitem">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m4 20 4.2-1L19 8.2 15.8 5 5 15.8 4 20Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="m13.8 7 3.2 3.2" stroke="currentColor" stroke-width="1.6"/></svg>
            Rename
          </button>
          <div class="menu-rule" role="separator"></div>
          <button class="menu-item menu-item-danger card-delete" type="button" role="menuitem">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M5 7h14M9 7V4.8h6V7M7 7l.8 12.2h8.4L17 7M10 11v4.5M14 11v4.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
            Delete
          </button>
        </div>
      </div>
    </article>
  </template>

  <dialog class="modal" id="actionDialog" aria-labelledby="actionTitle">
    <form class="modal-panel" id="actionForm">
      <div class="modal-icon" id="actionIcon" aria-hidden="true"></div>
      <h2 id="actionTitle">Rename document</h2>
      <p class="modal-description" id="actionDescription">Give this document a name you'll recognize later.</p>
      <label class="field" id="renameField">
        <span>Title</span>
        <input id="renameInput" type="text" maxlength="200" autocomplete="off" placeholder="Untitled document">
      </label>
      <div class="modal-actions">
        <button class="button button-quiet" type="button" id="actionCancel">Cancel</button>
        <button class="button button-primary" type="button" id="actionConfirm">Save</button>
      </div>
    </form>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</body>
</html>
