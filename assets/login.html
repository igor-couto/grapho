<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in - Grapho</title>
  <meta name="theme-color" content="#f3efe6">
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.ico">
  <link rel="preload" href="/assets/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/assets/fonts/literata-latin.woff2" as="font" type="font/woff2" crossorigin>
  <script src="/assets/theme.js"></script>
  <link rel="stylesheet" href="/assets/app.css">
  <script src="/assets/menu.js" defer></script>
  <script src="/assets/login.js" defer></script>
</head>
<body class="auth-page">
  <header class="site-header">
    <div class="shell site-header-inner error-header-row">
      <div class="menu-wrap">
        <button class="icon-button" type="button" id="pageMenuButton" aria-label="Page options" title="Page options" aria-haspopup="menu" aria-expanded="false">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <circle cx="5" cy="12" r="1.5" fill="currentColor"/>
            <circle cx="12" cy="12" r="1.5" fill="currentColor"/>
            <circle cx="19" cy="12" r="1.5" fill="currentColor"/>
          </svg>
        </button>
        <div class="popover-menu library-menu" id="pageMenu" role="menu" aria-label="Page options" hidden></div>
      </div>
    </div>
  </header>

  <main class="auth-main shell">
    <div class="auth-card">
      <div class="auth-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none">
          <rect x="4.6" y="10.4" width="14.8" height="9.4" rx="2.2" stroke="currentColor" stroke-width="1.7"/>
          <path d="M8.2 10.2V7.8a3.8 3.8 0 0 1 7.6 0v2.4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
          <circle cx="12" cy="14.9" r="1.5" fill="currentColor"/>
        </svg>
      </div>
      <h1>This library is locked</h1>
      <p class="auth-lede">Enter the password to open Grapho.</p>
      <form id="loginForm" novalidate>
        <label class="field" for="password">
          <span>Password</span>
          <input id="password" name="password" type="password" autocomplete="current-password" required autofocus>
        </label>
        <p class="field-error" id="loginError" role="alert" hidden></p>
        <button class="button button-primary auth-submit" type="submit" id="loginSubmit">Unlock</button>
      </form>
    </div>
  </main>
</body>
</html>
