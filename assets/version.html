<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Version - Grapho</title>
  <meta name="theme-color" content="#232126">
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.ico">
  <link rel="preload" href="/assets/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/assets/fonts/literata-latin.woff2" as="font" type="font/woff2" crossorigin>
  <script src="/assets/theme.js"></script>
  <script src="/assets/menu.js" defer></script>
  <script src="/assets/version.js" defer></script>
  <link rel="stylesheet" href="/assets/app.css">
</head>
<body class="version-page">
  <header class="editor-header version-header">
    <div class="editor-header-start">
      <a class="back-link" href="/" aria-label="Back to library">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="m14.5 5-7 7 7 7" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span>Library</span>
      </a>
    </div>

    <div class="editor-header-end">
      <div class="menu-wrap">
        <button class="icon-button" type="button" id="pageMenuButton" aria-label="Page options" title="Page options" aria-haspopup="menu" aria-expanded="false">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <circle cx="5" cy="12" r="1.5" fill="currentColor"/>
            <circle cx="12" cy="12" r="1.5" fill="currentColor"/>
            <circle cx="19" cy="12" r="1.5" fill="currentColor"/>
          </svg>
        </button>
        <div class="popover-menu library-menu" id="pageMenu" role="menu" aria-label="Page options" hidden></div>
      </div>
    </div>
  </header>

  <main class="version-main shell">
    <div class="version-card">
      <h1>Version</h1>
      <dl class="version-facts">
        <div class="version-fact">
          <dt>Version</dt>
          <dd>{{version}}</dd>
        </div>
        <div class="version-fact">
          <dt>Tag</dt>
          <dd>{{tag}}</dd>
        </div>
        <div class="version-fact">
          <dt>Commit</dt>
          <dd>{{commit}}</dd>
        </div>
        <div class="version-fact">
          <dt>Commit date</dt>
          <dd>{{commit_date}}</dd>
        </div>
      </dl>
      <p class="version-update" id="versionUpdate" role="status" aria-live="polite" data-version="{{version}}"></p>
    </div>
  </main>
</body>
</html>
