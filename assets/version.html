<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Version — Grapho</title>
  <meta name="theme-color" content="#f3efe6">
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.ico">
  <link rel="preload" href="/assets/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/assets/fonts/literata-latin.woff2" as="font" type="font/woff2" crossorigin>
  <script src="/assets/theme.js"></script>
  <script src="/assets/version.js" defer></script>
  <link rel="stylesheet" href="/assets/app.css">
</head>
<body class="version-page">
  <header class="site-header">
    <div class="shell site-header-inner error-header-row">
      <button class="icon-button theme-toggle" type="button" data-theme-toggle aria-label="Switch to dark theme">
        <svg class="icon icon-sun" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <circle cx="12" cy="12" r="3.5" stroke="currentColor" stroke-width="1.7"/>
          <path d="M12 2.8v2M12 19.2v2M21.2 12h-2M4.8 12h-2M18.5 5.5l-1.4 1.4M6.9 17.1l-1.4 1.4M18.5 18.5l-1.4-1.4M6.9 6.9 5.5 5.5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
        </svg>
        <svg class="icon icon-moon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M20 14.4A8.2 8.2 0 0 1 9.6 4a8.2 8.2 0 1 0 10.4 10.4Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>
  </header>

  <main class="version-main shell">
    <div class="version-card">
      <h1>Version</h1>
      <dl class="version-facts">
        <div class="version-fact">
          <dt>Version</dt>
          <dd>{{version}}</dd>
        </div>
        <div class="version-fact">
          <dt>Tag</dt>
          <dd>{{tag}}</dd>
        </div>
        <div class="version-fact">
          <dt>Commit</dt>
          <dd>{{commit}}</dd>
        </div>
        <div class="version-fact">
          <dt>Commit date</dt>
          <dd>{{commit_date}}</dd>
        </div>
      </dl>
      <p class="version-update" id="versionUpdate" role="status" aria-live="polite" data-version="{{version}}"></p>
    </div>
  </main>
</body>
</html>
