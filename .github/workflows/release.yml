name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  validate:
    name: Validate tag
    runs-on: ubuntu-latest
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@v7

      - name: Check the tag matches Cargo.toml
        shell: bash
        run: |
          set -euo pipefail

          version="$(awk -F'"' '/^version = "/ { print $2; exit }' Cargo.toml)"
          if [[ -z "$version" ]]; then
            echo "::error::Could not read the package version from Cargo.toml."
            exit 1
          fi

          if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match Cargo.toml version $version. Tag the release as v$version."
            exit 1
          fi

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache the build
        uses: Swatinem/rust-cache@v2
        with:
          key: validate

      - name: Test
        run: cargo test --locked --all-targets

  build:
    name: Build ${{ matrix.name }}
    needs: validate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            rust_targets: x86_64-unknown-linux-musl
            package: tar.gz
          - name: linux-aarch64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            rust_targets: aarch64-unknown-linux-musl
            package: tar.gz
          - name: macos-universal
            os: macos-15
            target: universal
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            package: tar.gz
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            rust_targets: x86_64-pc-windows-msvc
            package: zip
          - name: windows-aarch64
            os: windows-11-arm
            target: aarch64-pc-windows-msvc
            rust_targets: aarch64-pc-windows-msvc
            package: zip

    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Cache the build
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}

      - name: Install musl tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build (Linux)
        if: runner.os == 'Linux'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail

          # rust-lld links against the musl runtime bundled with the Rust
          # target, without depending on the host's musl-gcc wrapper.
          upper="$(echo "$TARGET" | tr 'a-z-' 'A-Z_')"
          export "CARGO_TARGET_${upper}_LINKER=rust-lld"

          cargo build --locked --release --target "$TARGET" --bin grapho

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: cargo build --locked --release --target ${{ matrix.target }} --bin grapho

      - name: Build the macOS universal binary
        if: runner.os == 'macOS'
        shell: bash
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.0"
        run: |
          set -euo pipefail

          for target in aarch64-apple-darwin x86_64-apple-darwin; do
            cargo build --locked --release --target "$target" --bin grapho
          done

          mkdir -p target/universal/release
          lipo -create \
            target/aarch64-apple-darwin/release/grapho \
            target/x86_64-apple-darwin/release/grapho \
            -output target/universal/release/grapho

          architectures="$(lipo -archs target/universal/release/grapho)"
          echo "Built for: $architectures"
          [[ "$architectures" == *arm64* && "$architectures" == *x86_64* ]]

          # lipo invalidates the slices' signatures. An arm64 Mach-O must carry
          # at least an ad-hoc signature to run on Apple Silicon.
          codesign --force --sign - target/universal/release/grapho
          codesign --verify --strict target/universal/release/grapho

      - name: Package (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail

          version="${GITHUB_REF_NAME#v}"
          stage="grapho-${version}-${{ matrix.name }}"
          mkdir -p "dist/$stage"

          if [[ "${{ matrix.target }}" == "universal" ]]; then
            binary="target/universal/release/grapho"
          else
            binary="target/${{ matrix.target }}/release/grapho"
          fi

          cp "$binary" "dist/$stage/grapho"
          cp README.md LICENSE "dist/$stage/"
          chmod +x "dist/$stage/grapho"

          if [[ "${{ matrix.target }}" == *-linux-musl ]]; then
            if ! file -b "dist/$stage/grapho" | grep -qE 'static-pie linked|statically linked'; then
              echo "::error::Expected a static Linux binary."
              file "dist/$stage/grapho"
              exit 1
            fi
          fi

          tar -C dist -czf "dist/$stage.tar.gz" "$stage"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $version = $env:GITHUB_REF_NAME.Substring(1)
          $stage = "grapho-$version-${{ matrix.name }}"
          New-Item -ItemType Directory -Path "dist/$stage" -Force | Out-Null

          Copy-Item "target/${{ matrix.target }}/release/grapho.exe" "dist/$stage/grapho.exe"
          Copy-Item README.md, LICENSE "dist/$stage/"
          Compress-Archive -Path "dist/$stage" -DestinationPath "dist/$stage.zip" -Force

      - name: Upload the archive
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: dist/*.${{ matrix.package }}
          if-no-files-found: error
          retention-days: 7

  packages:
    name: Build Linux packages
    needs: build
    runs-on: ubuntu-latest
    env:
      NFPM_VERSION: "2.49.0"
      NFPM_SHA256: "2afaa5ffb5e3493402e31e7c67a5a1fb42133e3f66fc315ca0051934125561c7"
    steps:
      - name: Download Linux archives
        uses: actions/download-artifact@v8
        with:
          path: packages
          pattern: linux-*
          merge-multiple: true

      - name: Install nfpm
        shell: bash
        run: |
          set -euo pipefail

          archive="$RUNNER_TEMP/nfpm.tar.gz"
          curl --fail --silent --show-error --location \
            "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz" \
            --output "$archive"
          echo "${NFPM_SHA256}  ${archive}" | sha256sum --check --strict

          mkdir -p "$RUNNER_TEMP/nfpm-bin" "$RUNNER_TEMP/bin"
          tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP/nfpm-bin"
          nfpm="$(find "$RUNNER_TEMP/nfpm-bin" -type f -name nfpm -perm -u+x -print -quit)"
          if [[ -z "$nfpm" ]]; then
            echo "::error::nfpm was not found in the downloaded archive."
            exit 1
          fi

          install --mode 0755 "$nfpm" "$RUNNER_TEMP/bin/nfpm"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/bin/nfpm" --version

      - name: Build .deb and .rpm
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          version="${TAG#v}"
          mkdir -p dist

          for archive in packages/*.tar.gz; do
            case "$(basename "$archive")" in
              *-linux-x86_64.tar.gz) arch=amd64 ;;
              *-linux-aarch64.tar.gz) arch=arm64 ;;
              *)
                echo "::error::Unexpected Linux archive: $archive"
                exit 1
                ;;
            esac

            root="$RUNNER_TEMP/package-$arch"
            rm -rf "$root"
            mkdir -p "$root"
            tar --extract --gzip --file "$archive" --directory "$root"

            binary="$(find "$root" -type f -name grapho -perm -u+x -print -quit)"
            if [[ -z "$binary" ]]; then
              echo "::error::grapho was not found in $archive."
              exit 1
            fi

            for packager in deb rpm; do
              BINARY_PATH="$binary" ARCH="$arch" VERSION="$version" \
                nfpm package --config nfpm.yaml --packager "$packager" --target dist/
            done
          done

          ls -lh dist

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: linux-packages
          path: |
            dist/*.deb
            dist/*.rpm
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish release
    needs: [build, packages]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download the archives
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Write checksums
        working-directory: dist
        shell: bash
        run: sha256sum -- *.tar.gz *.zip *.deb *.rpm > SHA256SUMS.txt

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail

          version="${TAG#v}"
          prerelease=()
          if [[ "$TAG" == *-* ]]; then
            prerelease=(--prerelease)
          fi

          gh release create "$TAG" \
            --verify-tag \
            --title "Grapho $version" \
            --generate-notes \
            "${prerelease[@]}" \
            dist/*
