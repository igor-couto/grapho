[package]
name = "grapho"
version = "0.2.0"
edition = "2021"
rust-version = "1.89"
description = "A quiet, local-first document editor."
license = "GPL-3.0-only"
repository = "https://github.com/igor-couto/grapho"
readme = "README.md"

[dependencies]
ammonia = "4"
argon2 = "0.6"
axum = "0.8"
base64 = "0.22"
getrandom = "0.4"
html-escape = "0.2"
rpassword = "7.5.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
uuid = { version = "1", features = ["serde", "v4"] }

# Google Drive talks HTTPS over rustls (with ring), so the binary carries its own
# trust store and no OpenSSL.
ureq = { version = "2", default-features = false, features = ["tls"] }

[dev-dependencies]
tower = { version = "0.5.3", features = ["util"] }

# Free space comes from one `statvfs` call; the standard library has no answer.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
lto = "thin"
strip = true
