[package]
name = "grapho"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
description = "A quiet, local-first document editor."
license = "GPL-3.0-only"
repository = "https://github.com/igor-couto/grapho"
readme = "README.md"

[dependencies]
ammonia = "4"
axum = "0.8"
html-escape = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync"] }
uuid = { version = "1", features = ["serde", "v4"] }

[profile.release]
lto = "thin"
strip = true
